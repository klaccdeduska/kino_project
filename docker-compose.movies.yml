services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: local_root_password
      MARIADB_DATABASE: kino
      MARIADB_USER: kino_user
      MARIADB_PASSWORD: change_me
    ports:
      - '3308:3306'
    volumes:
      - kino_movies_data:/var/lib/mysql
      - ./database/movies.sql:/docker-entrypoint-initdb.d/01-movies.sql:ro
volumes:
  kino_movies_data:
