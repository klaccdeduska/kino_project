services:

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    restart: unless-stopped

  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: local_root_password
      MARIADB_DATABASE: kino
      MARIADB_USER: kino_user
      MARIADB_PASSWORD: change_me
      TZ: Europe/Tallinn
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
    ports:
      - '3308:3306'
    volumes:
      - kino_movies_data:/var/lib/mysql
volumes:
  kino_movies_data:
