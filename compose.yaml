services:
  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    restart: unless-stopped

  k6:
    image: grafana/k6:latest
    profiles:
      - testing
    volumes:
      - ./tests/load:/scripts:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: local_root_password
      MARIADB_DATABASE: kino
      MARIADB_USER: kino_user
      MARIADB_PASSWORD: change_me
      TZ: Europe/Tallinn
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
    ports:
      - '3308:3306'
    volumes:
      - kino_movies_data:/var/lib/mysql
volumes:
  kino_movies_data:

  